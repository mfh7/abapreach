# Licenses of the crates that ship in the release binaries (the LICENSE of this
# project is MIT). Dev and build dependencies are not in the binaries.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The project itself is not a third-party component.
[private]
ignore = true
